[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gguf-compress"
version = "0.1.0"
description = "Experimental GGUF low-rank and seed-projection compressor with honest quality/speed benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shtenco"}]
dependencies = [
  "numpy>=2.0",
  "gguf>=0.19.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["torch>=2.4"]

[project.scripts]
gguf-compress = "gguf_compress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
