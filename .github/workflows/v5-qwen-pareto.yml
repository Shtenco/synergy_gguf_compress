name: V5 Qwen activation-aware Pareto E2E

on:
  push:
    branches:
      - feat/global-budget-activation-v5
  workflow_dispatch:

jobs:
  qwen-v5-pareto:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LLAMA_COMMIT: 5f436dddb440a288ee5611d7d1eca564a6aca9f4
      HF_HUB_DISABLE_XET: "1"
      HF_MODEL: Qwen/Qwen2.5-0.5B-Instruct
      GGUF_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true

    steps:
      - name: Checkout gguf_compress V5
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install V5 with calibration dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev,calibrate]'

      - name: Run unit tests
        run: pytest -q

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_COMMIT }}
          path: llama.cpp
          fetch-depth: 1

      - name: Apply packed-Q4 runtime patch
        run: python llama_cpp_v3/apply_patch.py llama.cpp

      - name: Build llama-bench and llama-perplexity
        run: |
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=OFF
          cmake --build llama.cpp/build --target llama-bench llama-perplexity -j2

      - name: Download official Qwen GGUF and calibration corpus
        run: |
          mkdir -p e2e
          curl -L --fail --retry 5 --retry-delay 3 "$GGUF_URL" -o e2e/qwen-q4-k-m.gguf
          curl -L --fail --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt \
            -o e2e/corpus.txt
          sha256sum e2e/qwen-q4-k-m.gguf | tee e2e/source.sha256
          ls -lh e2e/qwen-q4-k-m.gguf e2e/corpus.txt

      - name: Capture real activation statistics
        run: |
          gguf-compress calibrate-hf \
            "$HF_MODEL" \
            e2e/corpus.txt \
            e2e/qwen-activation-stats.npz \
            --max-samples 6 \
            --max-length 192 \
            --device cpu \
            | tee e2e/calibration-report.json

      - name: Build V5 global-budget Pareto frontier and run E2E
        run: |
          gguf-compress pareto-v5 \
            e2e/qwen-q4-k-m.gguf \
            e2e/qwen-activation-stats.npz \
            e2e/v5 \
            --ranks 8,16,32,64,128 \
            --residual-densities 0,0.0025,0.01 \
            --target-ratios 0.90,0.75,0.60,0.45 \
            --max-activation-rel-rmse 0.50 \
            --llama-bench llama.cpp/build/bin/llama-bench \
            --llama-perplexity llama.cpp/build/bin/llama-perplexity \
            --corpus e2e/corpus.txt \
            --prompt-tokens 128 \
            --gen-tokens 64 \
            --repetitions 2 \
            --context-size 512 \
            --timeout 1800 \
            | tee e2e/v5-console.json

      - name: Print Pareto table
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("e2e/v5/pareto-v5.json")
          if not p.exists():
              print("pareto-v5.json not produced")
              raise SystemExit(0)
          report = json.loads(p.read_text())
          for x in report["points"]:
              print({
                  "target_ratio": x.get("target_ratio"),
                  "status": x.get("status"),
                  "native_MiB": round((x.get("native_q4_bytes") or 0) / 2**20, 2),
                  "compression": x.get("file_compression_ratio"),
                  "activation_rmse": x.get("estimated_activation_rel_rmse"),
                  "ppl_ratio": x.get("perplexity_ratio"),
                  "kl": x.get("kl_divergence"),
                  "pp_speedup": x.get("prompt_processing_speedup"),
                  "tg_speedup": x.get("generation_speedup"),
                  "pareto": x.get("pareto"),
              })
          PY

      - name: Upload V5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-v5-pareto-evidence
          path: |
            e2e/*.json
            e2e/*.sha256
            e2e/*.npz
            e2e/v5/*.json
            e2e/v5/*.csv
            e2e/v5/*.svg
          if-no-files-found: warn
          retention-days: 14
