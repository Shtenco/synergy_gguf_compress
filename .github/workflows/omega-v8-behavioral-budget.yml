name: NEXUS Omega-MIX V8 behavioral budget

on:
  push:
    branches:
      - feat/omega-mix-v8-behavioral-budget
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_omega_v7_search.py tests/test_omega_v8_budget.py

  qwen-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LLAMA_COMMIT: 5f436dddb440a288ee5611d7d1eca564a6aca9f4
      HF_HUB_DISABLE_XET: "1"
      HF_MODEL: Qwen/Qwen2.5-0.5B-Instruct
      GGUF_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev,calibrate]'

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_COMMIT }}
          path: llama.cpp
          fetch-depth: 1

      - name: Patch and build runtime
        run: |
          python llama_cpp_v3/apply_patch.py llama.cpp
          cmake -S llama.cpp -B llama.cpp/build             -DCMAKE_BUILD_TYPE=Release             -DLLAMA_CURL=OFF             -DLLAMA_BUILD_TESTS=OFF             -DLLAMA_BUILD_EXAMPLES=ON             -DLLAMA_BUILD_SERVER=ON
          cmake --build llama.cpp/build --target llama-server -j2

      - name: Download source and corpus
        run: |
          mkdir -p e2e
          curl -L --fail --retry 5 "$GGUF_URL" -o e2e/source.gguf
          curl -L --fail --retry 5             https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt             -o e2e/corpus.txt
          sha256sum e2e/source.gguf | tee e2e/source.sha256

      - name: Capture real activation statistics
        run: |
          gguf-compress calibrate-hf             "$HF_MODEL" e2e/corpus.txt e2e/activation.npz             --max-samples 6 --max-length 192 --device cpu             | tee e2e/calibration.json

      - name: Adaptive V8 search
        run: |
          python -m gguf_compress.omega_v8_budget             --server llama.cpp/build/bin/llama-server             --baseline e2e/source.gguf             --activation-stats e2e/activation.npz             --questions benchmarks/intelligence_core_40.jsonl             --output-dir e2e/v8             --ranks 8,16,32,64,128             --residual-densities 0,0.0025,0.01,0.03             --min-ratio 0.50             --max-ratio 0.98             --coarse-step 0.08             --tolerance 0.01             --max-refinements 8             --threads 4             | tee e2e/v8-console.json

      - name: Print optimizer verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("e2e/v8/omega-v8-behavioral-budget.json")
          if not p.exists():
              print("V8 report not produced")
              raise SystemExit(0)
          r=json.loads(p.read_text())
          print("BASELINE", r["baseline"])
          print("BRACKET", r["observed_pass_fail_bracket"])
          print("SELECTED", r["selected"])
          print("VERDICT", r["verdict"])
          PY

      - name: Enforce strict winner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("e2e/v8/omega-v8-behavioral-budget.json").read_text())
          if r["verdict"] != "PASS":
              raise SystemExit("No strict behavioral-preserving candidate found")
          s=r["selected"]
          cmp=s["full"]["comparison"]
          assert cmp["regressions"] == 0
          assert cmp["baseline_correct_retention"] >= 1.0
          assert cmp["accuracy_delta"] >= 0.0
          print("WINNER_BYTES", s["native_q4_bytes"])
          print("WINNER_RATIO", s["target_ratio"])
          print("COMPRESSION", s["file_compression_ratio"])
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-omega-v8-behavioral-budget
          path: |
            e2e/*.json
            e2e/*.sha256
            e2e/v8/*.json
            e2e/v8/*.gguf
          if-no-files-found: warn
          retention-days: 14
