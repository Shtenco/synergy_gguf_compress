name: NEXUS Omega-MIX V6 intelligence

on:
  push:
    branches:
      - feat/omega-mix-infinity-v6
  workflow_dispatch:

jobs:
  omega-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LLAMA_COMMIT: 5f436dddb440a288ee5611d7d1eca564a6aca9f4
      HF_HUB_DISABLE_XET: "1"
      HF_MODEL: Qwen/Qwen2.5-0.5B-Instruct
      GGUF_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev,calibrate]'

      - name: Unit tests
        run: pytest -q

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_COMMIT }}
          path: llama.cpp
          fetch-depth: 1

      - name: Apply packed-Q4 runtime patch
        run: python llama_cpp_v3/apply_patch.py llama.cpp

      - name: Build runtime
        run: |
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build llama.cpp/build --target llama-server llama-bench llama-perplexity -j2

      - name: Download source model and corpus
        run: |
          mkdir -p e2e
          curl -L --fail --retry 5 --retry-delay 3 "$GGUF_URL" -o e2e/source.gguf
          curl -L --fail --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt \
            -o e2e/corpus.txt
          sha256sum e2e/source.gguf | tee e2e/source.sha256

      - name: Capture real activation statistics
        run: |
          gguf-compress calibrate-hf \
            "$HF_MODEL" e2e/corpus.txt e2e/activation.npz \
            --max-samples 6 --max-length 192 --device cpu \
            | tee e2e/calibration.json

      - name: Build Omega-MIX V6 candidates
        run: |
          python -m gguf_compress.omega_pareto \
            e2e/source.gguf e2e/activation.npz e2e/omega \
            --target-ratios 0.90,0.75,0.60 \
            --ranks 8,16,32,64,128 \
            --residual-densities 0,0.0025,0.01,0.03 \
            | tee e2e/omega-console.json

      - name: Select candidate
        id: select
        shell: bash
        run: |
          python - <<'PY' | tee e2e/selection.txt
          import json
          from pathlib import Path
          r=json.loads(Path("e2e/omega/omega-v6-report.json").read_text())
          p=r.get("recommended")
          if not p:
              raise SystemExit("No feasible Omega-MIX candidate")
          print(p["native_q4_path"])
          Path("e2e/candidate_path.txt").write_text(p["native_q4_path"])
          PY
          echo "path=$(cat e2e/candidate_path.txt)" >> "$GITHUB_OUTPUT"

      - name: Baseline vs Omega-MIX intelligence test
        run: |
          python -m gguf_compress.intelligence \
            --server llama.cpp/build/bin/llama-server \
            --baseline e2e/source.gguf \
            --candidate "${{ steps.select.outputs.path }}" \
            --questions benchmarks/intelligence_core_40.jsonl \
            --output e2e/intelligence.json \
            --threads 4 \
            | tee e2e/intelligence-console.json

      - name: Print intelligence verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("e2e/intelligence.json")
          if not p.exists():
              print("intelligence report not produced")
              raise SystemExit(0)
          r=json.loads(p.read_text())
          print("BASELINE", r["baseline"])
          print("OMEGA", r["candidate"])
          print("COMPARISON", r["comparison"])
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-omega-v6-intelligence
          path: |
            e2e/*.json
            e2e/*.txt
            e2e/*.sha256
            e2e/*.npz
            e2e/omega/*.json
            e2e/omega/*.gguf
          if-no-files-found: warn
          retention-days: 14
